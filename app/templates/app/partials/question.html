<form class="flex flex-col gap-5"
      hx-post="/app/sessions/{{ session_id }}/answers"
      hx-target="#study"
      hx-swap="innerHTML">
    <input type="hidden" name="question_id" value="{{ question.id }}">
    {% if error %}
    <div class="border-l-[3px] border-l-bad bg-bad/10 px-3 py-2.5 text-sm text-bad">{{ error }}</div>
    {% endif %}
    <div class="font-serif text-lg leading-relaxed text-ink">{{ question.stem | text_blocks }}</div>
    <div class="border-t border-line">
        {% for o in labeled_options %}
        <label class="flex cursor-pointer items-start gap-3 border-b border-line py-3">
            <input class="mt-1.5" type="{{ 'radio' if question.type == 'single' else 'checkbox' }}"
                   name="selected"
                   value="{{ o.id }}">
            <span class="min-w-[1.25em] font-semibold tabular-nums text-mute">{{ o.label }}.</span>
            <span class="text-ink">{{ o.text | text_blocks }}</span>
        </label>
        {% endfor %}
    </div>
    <div class="flex flex-wrap items-center gap-3">
        <label class="flex items-center gap-2 text-sm text-mute">
            Confidence
            <select name="confidence" class="rounded border border-line bg-surface px-2.5 py-2 text-ink">
                <option value="confident">confident</option>
                <option value="educated_guess">educated guess</option>
                <option value="complete_guess">complete guess</option>
            </select>
        </label>
        <button class="inline-flex cursor-pointer items-center rounded border-0 bg-accent px-4 py-2.5 text-sm font-semibold text-accent-fg" type="submit">
            Submit
        </button>
    </div>
    {% if question.type == 'select_two' %}
    <p class="text-sm text-mute">Pick exactly two options.</p>
    {% endif %}
</form>
