<form class="flex flex-col gap-3 rounded-xl border border-line bg-surface px-6 py-5"
      hx-post="/app/sessions/{{ session_id }}/answers"
      hx-target="#study"
      hx-swap="innerHTML">
    <input type="hidden" name="question_id" value="{{ question.id }}">
    {% if error %}
    <div class="rounded-lg border border-bad bg-bad/10 px-3 py-2.5 text-bad">{{ error }}</div>
    {% endif %}
    <div>{{ question.stem | text_blocks }}</div>
    <div>
        {% for o in labeled_options %}
        <label class="my-2 flex cursor-pointer items-start gap-2.5 rounded-lg border border-line px-3 py-2.5">
            <input class="mt-1" type="{{ 'radio' if question.type == 'single' else 'checkbox' }}"
                   name="selected"
                   value="{{ o.id }}">
            <span class="min-w-[1.2em] font-bold text-mute">{{ o.label }}.</span>
            <span>{{ o.text | text_blocks }}</span>
        </label>
        {% endfor %}
    </div>
    <div class="flex flex-wrap items-center gap-3">
        <label class="flex items-center gap-2">
            Confidence
            <select name="confidence" class="rounded-lg border border-line bg-surface px-2.5 py-2 text-ink">
                <option value="confident">confident</option>
                <option value="educated_guess">educated guess</option>
                <option value="complete_guess">complete guess</option>
            </select>
        </label>
        <button class="inline-flex cursor-pointer items-center rounded-lg border-0 bg-accent px-4 py-2.5 font-semibold text-accent-fg" type="submit">
            Submit
        </button>
    </div>
    {% if question.type == 'select_two' %}
    <p class="text-mute">Pick exactly two options.</p>
    {% endif %}
</form>
