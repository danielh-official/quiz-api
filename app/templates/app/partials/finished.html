<div class="flex flex-col gap-6">
    <h1 class="text-[1.75rem] font-semibold leading-tight tracking-tight text-ink">Session finished</h1>
    <div class="flex flex-wrap items-baseline gap-x-6 gap-y-2 border-y border-line py-4">
        <div>
            <span class="text-[1.75rem] font-semibold tabular-nums text-ink">{{ summary.answered }}</span>
            <span class="ml-1.5 text-sm text-mute">answered</span>
        </div>
        <div>
            <span class="text-[1.75rem] font-semibold tabular-nums text-ink">{{ summary.correct }}</span>
            <span class="ml-1.5 text-sm text-mute">correct</span>
        </div>
        <div>
            <span class="text-[1.75rem] font-semibold tabular-nums {% if summary.misconceptions > 0 %}text-due{% else %}text-ink{% endif %}">{{ summary.misconceptions }}</span>
            <span class="ml-1.5 text-sm text-mute">misconceptions</span>
        </div>
    </div>
    <ul class="space-y-1 p-0 text-sm">
        {% for key, row in summary.by_confidence.items() %}
        <li class="flex justify-between gap-4 border-b border-line py-2">
            <span class="text-mute">{{ key|confidence_label }}</span>
            <span class="tabular-nums text-ink">{{ row.correct }}/{{ row.answered }}</span>
        </li>
        {% endfor %}
    </ul>
    <a class="inline-flex w-fit items-center rounded bg-accent px-4 py-2.5 text-sm font-semibold text-accent-fg no-underline" href="/app">
        Back to decks
    </a>
</div>
