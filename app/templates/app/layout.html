<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}Quiz{% endblock %} · Quiz API</title>
    <script>
        try { document.documentElement.dataset.theme = localStorage.getItem("theme") || ""; } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/app.css">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
</head>

<body class="flex min-h-screen flex-col">
    <header class="border-b border-line">
        <div class="mx-auto flex max-w-3xl items-center justify-between gap-3 px-4 py-3 font-mono text-[13px] sm:px-6">
            <span class="py-1 font-bold"><a class="no-underline" href="/app">quiz</a></span>
            <nav class="flex items-center gap-4 text-mute">
                {% if user %}
                <span>{{ user.login }}</span>
                <form method="post" action="/app/logout" class="inline">
                    <button class="cursor-pointer border-0 bg-transparent p-0 font-mono text-mute hover:text-ink" type="submit">log out</button>
                </form>
                {% endif %}
            </nav>
        </div>
    </header>
    <main class="mx-auto w-full max-w-3xl flex-1 px-4 pt-8 pb-8 sm:px-6">
        {% block content %}{% endblock %}
    </main>
    <footer class="mt-4 border-t border-line">
        <div class="mx-auto flex max-w-3xl flex-wrap items-center justify-between gap-3 px-4 py-4 text-sm sm:px-6">
            <a class="text-mute no-underline hover:text-ink" href="/">Return home</a>
            <label class="flex items-center gap-2 text-mute">
                Theme
                <select id="theme" class="rounded border border-line bg-surface px-2 py-1 text-ink">
                    <option value="">System</option>
                    <option value="dark">Dark</option>
                    <option value="light">Light</option>
                </select>
            </label>
        </div>
    </footer>
    <script>
        function formatLocalDates(root) {
            (root || document).querySelectorAll("time[data-local-date]").forEach((el) => {
                const raw = el.dateTime || el.getAttribute("datetime");
                if (!raw) return;
                const d = new Date(raw);
                if (Number.isNaN(d.getTime())) return;
                el.textContent = d.toLocaleDateString(undefined, { dateStyle: "medium" });
            });
        }
        document.addEventListener("DOMContentLoaded", () => formatLocalDates());
        document.body.addEventListener("htmx:afterSwap", (e) => formatLocalDates(e.detail.target));

        const theme = document.getElementById("theme");
        theme.value = document.documentElement.dataset.theme;
        theme.addEventListener("change", () => {
            document.documentElement.dataset.theme = theme.value;
            try {
                if (theme.value) localStorage.setItem("theme", theme.value);
                else localStorage.removeItem("theme");
            } catch (e) {}
        });

        // Study keys: digits pick options, other keys press the [data-key] control (confidence, next).
        document.addEventListener("keydown", (e) => {
            const study = document.getElementById("study");
            if (!study || e.metaKey || e.ctrlKey || e.altKey) return;
            if (e.target.closest("textarea, select, input:not([type=radio]):not([type=checkbox])")) return;
            const key = e.key.toLowerCase();
            if (!/^[a-z0-9]$/.test(key)) return;
            const target = study.querySelectorAll("input[name=selected]")[Number(key) - 1]
                || study.querySelector(`[data-key="${key}"]`);
            if (!target) return;
            e.preventDefault();
            target.click();
        });
    </script>
</body>

</html>
