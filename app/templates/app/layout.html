<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}Quiz{% endblock %} · Quiz API</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
</head>

<body>
    <header class="border-b border-line bg-surface">
        <div class="mx-auto flex max-w-xl items-center justify-between gap-3 px-4 py-3">
            <a class="font-bold text-ink no-underline" href="/app">Quiz</a>
            <div class="flex items-center gap-3 text-sm text-mute">
                {% if user %}
                <span>{{ user.login }}</span>
                <form method="post" action="/app/logout" class="inline">
                    <button class="cursor-pointer border-0 bg-transparent p-0 text-accent" type="submit">Log out</button>
                </form>
                {% endif %}
            </div>
        </div>
    </header>
    <main class="mx-auto max-w-xl px-4 pb-16 pt-8">
        {% block content %}{% endblock %}
    </main>
</body>

</html>
