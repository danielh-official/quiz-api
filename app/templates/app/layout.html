<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}Quiz{% endblock %} · Quiz API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/app.css">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
</head>

<body class="flex min-h-screen flex-col">
    <header class="border-b border-line bg-surface">
        <div class="mx-auto flex max-w-xl items-center justify-between gap-3 px-4 py-3 sm:px-6">
            <a class="text-base font-semibold tracking-tight text-ink no-underline" href="/app">Quiz</a>
            <nav class="flex items-center gap-4 text-sm text-mute">
                {% if user %}
                <span>{{ user.login }}</span>
                <form method="post" action="/app/logout" class="inline">
                    <button class="cursor-pointer border-0 bg-transparent p-0 text-accent" type="submit">Log out</button>
                </form>
                {% endif %}
            </nav>
        </div>
    </header>
    <main class="mx-auto w-full max-w-xl flex-1 px-4 pt-8 pb-8 sm:px-6">
        {% block content %}{% endblock %}
    </main>
    <footer class="border-t border-line mt-4">
        <div class="mx-auto flex max-w-xl px-4 py-4 sm:px-6 justify-center">
            <a class="text-sm text-mute no-underline hover:text-ink" href="/">Return home</a>
        </div>
    </footer>
</body>

</html>
