<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Quiz API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/app.css">
</head>

<body>
    <header class="border-b border-line bg-surface">
        <div class="mx-auto flex max-w-xl items-center justify-between gap-3 px-4 py-3 sm:px-6">
            <a class="text-base font-semibold tracking-tight text-ink no-underline" href="/">Quiz API</a>
            <nav class="flex items-center gap-4 text-sm">
                <a class="font-medium text-accent no-underline hover:opacity-80" href="/app">Study</a>
            </nav>
        </div>
    </header>
    <main class="mx-auto max-w-3xl px-4 pb-16 pt-8 sm:px-6">
        {% block content %}{% endblock %}
        <p class="mt-12 border-t border-line pt-6 text-sm text-mute">Open source:
            <a href="https://github.com/danielh-official/quiz-api">danielh-official/quiz-api</a>.
            Not affiliated with GitHub, Anthropic or OpenAI.</p>
    </main>
    <script>
        // Copy buttons: the only client-side behaviour.
        document.querySelectorAll("[data-copy]").forEach((el) => {
            const text = el.textContent;
            const button = document.createElement("button");
            button.type = "button";
            button.className = "copy absolute top-2 right-2 cursor-pointer rounded border border-line bg-surface px-2 py-1 text-xs text-ink";
            button.textContent = "Copy";
            button.onclick = async () => {
                await navigator.clipboard.writeText(text);
                button.textContent = "Copied";
                setTimeout(() => (button.textContent = "Copy"), 1500);
            };
            el.append(button);
        });
    </script>
</body>

</html>
