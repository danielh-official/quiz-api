services:
  api:
    build: { context: ., target: dev }
    ports: ["8000:8080"]
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql://quiz:secret@postgres:5432/quiz
      TEST_DATABASE_URL: postgresql://quiz:secret@postgres:5432/test
    volumes: [".:/app", "/app/.venv"]
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: quiz
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "quiz"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
