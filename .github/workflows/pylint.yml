name: Pylint

on: [push]

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
    # Python comes from .python-version (3.13); the project's deps are needed so pylint can resolve imports.
    - name: Install dependencies
      run: uv sync --frozen
    - name: Analysing the code with pylint
      run: uv run --with pylint pylint app tests migrations
