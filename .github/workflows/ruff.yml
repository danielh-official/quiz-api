name: Ruff

on: [push]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: uv sync --frozen
    - name: Check formatting with ruff
      run: uv run --with ruff ruff format --check app tests migrations
