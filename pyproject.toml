[project]
name = "quiz-api"
version = "0.1.0"
description = "Spaced-repetition quiz REST API + MCP server"
authors = [
    { name = "Daniel (Haven) Hotyanov", email = "49914607+danielh-official@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "fastmcp>=4.0.9",
    "fsrs>=6.3.2",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "py-key-value-aio[postgresql]>=0.4.6",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pylint.main]
# Match the runtime path: repo root, so app/mcp.py doesn't shadow the mcp package,
# and tests/, which pytest puts on sys.path for `from conftest import ...`.
source-roots = ["."]
init-hook = "import sys; sys.path.append('tests')"

[tool.pylint.format]
max-line-length = 130

[tool.pylint.messages_control]
disable = [
    "not-callable",  # false positive on SQLAlchemy's func.count() / func.now()
    "missing-module-docstring",  # docstrings only where they add something
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",  # ORM and pydantic models
    "redefined-outer-name",  # pytest fixtures
    "cyclic-import",  # content/stats/study import each other; the back-edges are lazy imports
]

[tool.pylint.design]
max-args = 8  # MCP tool signatures are the tool schema
max-positional-arguments = 8

[tool.pylint.variables]
allowed-redefined-builtins = ["type"]  # question "type" is an API field name

[tool.pylint.typecheck]
# Dynamic attributes pylint can't see: SQLAlchemy's func.* and alembic's op/context proxies.
generated-members = ["sqlalchemy.func.*", "func.*", "alembic.op.*", "op.*", "alembic.context.*", "context.*"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
# Same import roots as runtime: repo root, and tests/ for `from conftest import ...`.
mypy_path = [".", "tests"]
explicit_package_bases = true
